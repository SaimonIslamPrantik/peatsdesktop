[package]
name = "peatsdesktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true